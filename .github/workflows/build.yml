name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

# 显式声明权限，这样就不依赖仓库设置里的
# 「Settings -> Actions -> General -> Workflow permissions」默认值了。
# contents: write 是创建 GitHub Release / 推送更新库所必需的
# （默认常常是只读，会导致 Release 步骤 403）。
permissions:
  contents: write
  actions: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "NYTN02@users.noreply.github.com"
          git config --global user.name "NYTN02"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true
          # partial-sync-repo 要对比「上次同步的 tag -> 当前 tag」来生成更新日志，
          # 浅克隆（默认 fetch-depth: 1）拿不到历史 tag，日志会为空或出错。
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          # 注意：PowerShell 步骤的最终退出码只看「最后一条原生命令」。
          # 模板原来的写法只跑 python -m unittest 而不检查 $LASTEXITCODE，
          # 于是前面的测试文件全挂了也可能判定为成功。这里每个文件都显式检查。
          $failed = @()
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error::Tests failed in $($_.FullName)"
                  $failed += $_.Name
              }
          }
          if ($failed.Count -gt 0) {
              throw "Tests failed in: $($failed -join ', ')"
          }

      - name: Sync Repositories # 同步部分代码(deploy.txt中), 合并tag中间更新日志, 到更新库, 以减少用户更新使用的git库大小
        id: sync   # Give the step an ID to access its outputs
        uses: ok-oldking/partial-sync-repo@master
        with:
          # 同步目标：
          #   * GitHub 更新库（Global 包的更新源）—— 需要 OK_GH
          #   * CNB 仓库（China 包的更新源）—— 需要 CNB_TOKEN
          #
          # ⚠️ repos 是块文本（| 之后的缩进内容），里面的 # 是数据不是注释。
          #    所以只能写真实地址；不要往里塞"注释行"，否则会被当成仓库地址
          #    传给 action 导致同步失败。要临时停用某一行就整行删掉。
          #
          # 对应的两个 secret 必须在
          # Settings -> Secrets and variables -> Actions 里配好：
          #   OK_GH     : 对 ok-naruto-update 有 Contents: Read and write 的 PAT
          #   CNB_TOKEN : CNB 访问令牌（用户名固定为 cnb，见 CNB 文档），
          #               授权范围要含仓库读写
          repos: |
            https://NYTN02:${{ secrets.OK_GH }}@github.com/NYTN02/ok-naruto-update.git
            https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/NekoBoxNeko/ok-naruto.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true #在更新日志中加入作者

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master #使用pyappify打包exe

      # 自动生成 Release 正文。
      # 关键点是**枚举实际产物**而不是维护一份手写清单：
      # pyappify 之前悄悄多产出了 online-setup.exe 和 win32_sha256.txt，
      # 而正文里是硬编码的清单，于是这两个文件被漏掉了很久没人发现。
      # 现在认不出来的文件也会被列进表格（标注「说明待补充」），不会再静默漏掉。
      - name: Build Release Body
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          START_TAG: ${{ steps.sync.outputs.start_tag }}
          END_TAG: ${{ steps.sync.outputs.end_tag }}
          # 经过 env 传递，避免提交信息里的引号破坏 shell 语法
          CHANGES: ${{ steps.sync.outputs.changes_with_asterisk }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'pyappify_dist'
          $base = "https://github.com/$env:REPO/releases/download/$env:TAG"

          # 顺序即表格里的显示顺序：推荐的排最前，不能用的（zip）和校验文件排最后
          $order = @('China-setup.exe', 'Global-setup.exe', 'online-setup.exe', 'sha256.txt', 'win32.zip')
          $desc = @{
            'China-setup.exe'  = '**国内用户推荐**：自带运行环境，更新源走腾讯 CNB'
            'Global-setup.exe' = '自带运行环境，更新源走 GitHub'
            'online-setup.exe' = '在线安装包：只含启动器，安装时再下载运行环境。下载容易中断时可用'
            'sha256.txt'       = '离线安装包的 SHA256 校验值'
            'win32.zip'        = '**不要下载**，这是下次构建用的加速缓存，运行不了'
          }

          $files = Get-ChildItem $dist -File
          if (-not $files) { throw "打包产物目录 $dist 是空的" }
          Write-Host "打包产物 $($files.Count) 个: $($files.Name -join ', ')"

          # 认不出来的产物排在 online 之后（rank 2.5），并标注待补充
          $entries = foreach ($f in $files) {
            $key = $null
            foreach ($k in $order) { if ($f.Name -like "*$k") { $key = $k; break } }
            $rank = 2.5
            $text = '（新增产物，说明待补充）'
            if ($key) {
              $rank = [array]::IndexOf($order, $key)
              $text = $desc[$key]
            }
            [pscustomobject]@{ File = $f; Rank = $rank; Desc = $text }
          }

          $body = @()
          $body += "### 更新日志 $env:START_TAG -> $env:END_TAG"
          $body += ''
          $body += $env:CHANGES.Trim()
          $body += ''
          $body += '### 下载哪个（Windows）'
          $body += ''
          $body += '| 文件 | 体积 | 说明 |'
          $body += '|---|---|---|'
          foreach ($e in ($entries | Sort-Object Rank, @{ Expression = { $_.File.Name } })) {
            $f = $e.File
            $size = if ($f.Extension -eq '.txt') { '—' }
                    else { "$([Math]::Round($f.Length / 1MB, 2)) MB" }
            $body += "| [$($f.Name)]($base/$($f.Name)) | $size | $($e.Desc) |"
          }
          $body += ''
          $body += '在意国内下载 / 自动更新速度的话选 China 包，它的更新源确定走腾讯 CNB。'
          $body += ''
          $body += '### 使用前提'
          $body += ''
          $body += '* 需要 MuMu 模拟器 12（目前只在 MuMu 上测试过，其它模拟器不保证可用）'
          $body += '* 模拟器分辨率设为 16:9，推荐 1600x900'
          $body += '* 游戏内按键布局保持默认（脚本按固定坐标点击技能 / 普攻 / 大招按钮）'
          $body += '* 从游戏主页面运行，并先关掉所有活动 / 公告弹窗'
          $body += '* 设备选择 `MuMuPlayer-12.0-0`（模拟器设备），不要选窗口'
          $body += '* 模拟器需开启 ADB 调试（MuMu 默认端口 16384）'
          $body += '* 杀软（火绒 / 360 等）若拦了 adb 写临时文件，程序会自动把 adb 的临时目录切到自身目录下的 `.tmp`'
          $body += ''
          $body += "**完整说明见 [README](https://github.com/$env:REPO/blob/master/README.md)。**"

          # 显式写 UTF-8 无 BOM：PowerShell 5.1 的 Out-File -Encoding utf8 会写 BOM，
          # pwsh 7 不会；BOM 混进 markdown 正文会影响渲染，所以两种版本都统一成无 BOM。
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path 'release_body.md'),
            ($body -join "`n"),
            $utf8NoBom)
          Write-Host "已生成 release_body.md（$((Get-Item release_body.md).Length) 字节）"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          # 带 '-' 的 tag（如 v0.1.1-beta.1）标为预发布，不要当成正式版
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 正文由上一步根据实际产物生成，不再手写文件清单
          body_path: release_body.md
          files: pyappify_dist/*
