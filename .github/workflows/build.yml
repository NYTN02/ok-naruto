name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

# 显式声明权限，这样就不依赖仓库设置里的
# 「Settings -> Actions -> General -> Workflow permissions」默认值了。
# contents: write 是创建 GitHub Release / 推送更新库所必需的
# （默认常常是只读，会导致 Release 步骤 403）。
permissions:
  contents: write
  actions: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "NYTN02@users.noreply.github.com"
          git config --global user.name "NYTN02"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true
          # partial-sync-repo 要对比「上次同步的 tag -> 当前 tag」来生成更新日志，
          # 浅克隆（默认 fetch-depth: 1）拿不到历史 tag，日志会为空或出错。
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          # 注意：PowerShell 步骤的最终退出码只看「最后一条原生命令」。
          # 模板原来的写法只跑 python -m unittest 而不检查 $LASTEXITCODE，
          # 于是前面的测试文件全挂了也可能判定为成功。这里每个文件都显式检查。
          $failed = @()
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error::Tests failed in $($_.FullName)"
                  $failed += $_.Name
              }
          }
          if ($failed.Count -gt 0) {
              throw "Tests failed in: $($failed -join ', ')"
          }

      - name: Sync Repositories # 同步部分代码(deploy.txt中), 合并tag中间更新日志, 到更新库, 以减少用户更新使用的git库大小
        id: sync   # Give the step an ID to access its outputs
        uses: ok-oldking/partial-sync-repo@master
        with:
          # 同步目标：
          #   * GitHub 更新库（Global 包的更新源）—— 需要 OK_GH
          #   * CNB 仓库（China 包的更新源）—— 需要 CNB_TOKEN
          #
          # ⚠️ repos 是块文本（| 之后的缩进内容），里面的 # 是数据不是注释。
          #    所以只能写真实地址；不要往里塞"注释行"，否则会被当成仓库地址
          #    传给 action 导致同步失败。要临时停用某一行就整行删掉。
          #
          # 对应的两个 secret 必须在
          # Settings -> Secrets and variables -> Actions 里配好：
          #   OK_GH     : 对 ok-naruto-update 有 Contents: Read and write 的 PAT
          #   CNB_TOKEN : CNB 访问令牌（用户名固定为 cnb，见 CNB 文档），
          #               授权范围要含仓库读写
          repos: |
            https://NYTN02:${{ secrets.OK_GH }}@github.com/NYTN02/ok-naruto-update.git
            https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/NekoBoxNeko/ok-naruto.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true #在更新日志中加入作者

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master #使用pyappify打包exe

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          # 带 '-' 的 tag（如 v0.1.1-beta.1）标为预发布，不要当成正式版
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ###  更新日志 ${{ steps.sync.outputs.start_tag }} -> ${{ steps.sync.outputs.end_tag }}:
              ${{ steps.sync.outputs.changes_with_asterisk }}          
            ### 下载包说明
              * [ok-naruto-win32-China-setup.exe](https://github.com/NYTN02/ok-naruto/releases/download/${{ github.ref_name }}/ok-naruto-win32-China-setup.exe) **国内用户推荐**，更新源走腾讯 CNB，下载和自动更新都更快
              * [ok-naruto-win32-Global-setup.exe](https://github.com/NYTN02/ok-naruto/releases/download/${{ github.ref_name }}/ok-naruto-win32-Global-setup.exe) 更新源走 GitHub，适合能顺畅访问 GitHub 的用户
              * 不要下载 `ok-naruto-win32.zip`，那是下次构建用的加速缓存，运行不了
            ### 使用前提
              * 需要 MuMu 模拟器 12，分辨率设为 1600x900（或其它 16:9）
              * 游戏内按键布局保持默认
              * 从游戏主页面运行，并先关掉活动弹窗
              * 模拟器需开启 ADB 调试；脚本通过 ADB/IPC 与模拟器通信
          files: pyappify_dist/*
