name: "ok-naruto"
uac: true
icon: "icons/icon.png"

# PyAppify 会把 profiles[].git_url 写进安装包，作为用户端的「自动更新源」。
# 所以它必须是**更新库**（只放运行需要的文件，见 deploy.txt），不是主开发库。
#
# 每个 profile 会打出一个独立的安装包；profile 名会出现在文件名里，
# 例如 ok-naruto-win32-Global-setup.exe。
#
# ⚠️ 第一条 profile 必须写全所有字段！
#    pyappify 的 apply_profile_inheritance() 只会从 profiles[0] 继承：
#        if profile.requires_python.is_empty():
#            profile.requires_python = first_profile.requires_python.clone()
#    也就是说后面的 profile 可以省略字段，但**第一条不能**。
#    曾经把带全字段的 China profile 注释掉、只留精简版的 Global，
#    结果 Global 变成 profiles[0] 且 requires_python 为空，
#    打包时卡在「安装 Python」直接失败。
#    tests/TestRelease.py 里有对应用例守着这个坑。
profiles:
  # ---- 默认包：更新源走 GitHub 更新库 ----
  - name: "Global"
    git_url: "https://github.com/NYTN02/ok-naruto-update.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true

  # ---- 国内镜像包（可选）----
  # 开启 CNB 国内镜像后启用下面的 China profile：国内用户装这个包，
  # 更新源走 cnb.cool，比直连 GitHub 快很多。
  #
  # CNB 社区版是「免费额度 + 超额按量」：
  #   * 仓库存储 100 GiB/月 免费，本项目仓库只有几 MB，用不到超额
  #   * 云原生构建 160 核时/月 免费；我们只是把它当 git 镜像仓库用，
  #     推送由 GitHub Actions 完成，不在 CNB 上跑构建，所以基本不消耗
  #   * 不需要自己买服务器，用户下载也不产生你的流量费
  #   * 不绑定腾讯云付费方式时，额度用尽只会受限，不会扣费
  #
  # 开通步骤见 RELEASE.md 第五节。要点：
  #   1) CNB 上先建「组织」，再在组织下建公开仓库 ok-naruto
  #   2) cnb.cool/profile/token 生成访问令牌，
  #      授权范围必须含「仓库读写」（公开仓库默认只有只读，推不上去）
  #   3) GitHub Secrets 加 CNB_TOKEN
  #   4) 启用下面这段（把 <组织名> 换掉）
  #   5) build.yml 的 Sync Repositories 里也加一行 CNB 地址
  #
  # 注意：这条在 Global 之后，所以可以省略字段（会继承 profiles[0] 的值）。
  # - name: "China"
  #   git_url: "https://cnb.cool/<组织名>/ok-naruto.git"
  #   admin: true
  #   main_script: "main.py"
  #   requires_python: "3.12"
  #   requirements: "requirements.txt"
  #   pip_args: "--no-deps"
  #   use_pythonw: true
  #   show_add_defender: true

  # ---- Web UI 包（可选，本项目是 Qt 桌面应用，用不到就别启用）----
